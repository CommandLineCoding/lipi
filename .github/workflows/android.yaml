name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and check the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # ncnn, built from source into the app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Compiling ncnn takes several minutes. ccache keys on file contents, so it works on a fresh checkout.
      - name: Set up ccache
        id: ccache
        working-directory: .
        run: |
          sudo apt-get install -y --no-install-recommends ccache > /dev/null
          echo "ncnn=$(git rev-parse HEAD:third_party/ncnn)" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.ccache.outputs.ncnn }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.ccache.outputs.ncnn }}-

      - name: Install the Android SDK parts the build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build, unit test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain

      - name: No network permission
        run: python3 tools/check_no_network.py app/build/outputs/apk/debug/app-debug.apk

      - name: Native libraries are 16 KB aligned
        run: python3 tools/check_alignment.py app/build/outputs/apk/debug/app-debug.apk

      - name: No proprietary or incompatible dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain | python3 tools/check_dependencies.py

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lipi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
