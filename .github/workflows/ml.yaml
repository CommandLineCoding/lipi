name: ML tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Evaluation harness and corpus tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-mono
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Test
        working-directory: ml
        run: python -m pytest -q
